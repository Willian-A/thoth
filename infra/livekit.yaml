# Configuração SÓ para desenvolvimento local. Nunca usar estas chaves em produção.
port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  # Anuncia 127.0.0.1 como candidato ICE. Sem isso o LiveKit anuncia o IP interno
  # do container, que o navegador fora do Docker (inclusive no WSL) não alcança.
  node_ip: 127.0.0.1
redis:
  address: redis:6379
keys:
  devkey: secret-de-desenvolvimento-com-32-caracteres
room:
  max_participants: 8
  empty_timeout: 300
logging:
  level: info
