name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.8.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Checar tipos
        run: pnpm typecheck
      - name: Lint, formatação e regra de camadas
        run: pnpm lint
      - name: Testes unitários e de componentes
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    services:
      redis:
        image: redis:8.8.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Serviços do Actions não aceitam argumentos, então o LiveKit sobe num passo próprio.
      - name: Subir LiveKit
        run: |
          docker run -d --name livekit --network host \
            -e LIVEKIT_KEYS="devkey: secret-de-desenvolvimento-com-32-caracteres" \
            livekit/livekit-server:v1.13.11 --node-ip "$(hostname -I | awk '{print $1}')"
          for i in $(seq 1 30); do curl -sf http://localhost:7880 && break; sleep 1; done
      - name: Instalar Chromium
        run: pnpm --filter @thoth/web exec playwright install --with-deps chromium
      - name: Rodar testes
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Logs do LiveKit
        if: failure()
        run: docker logs livekit
